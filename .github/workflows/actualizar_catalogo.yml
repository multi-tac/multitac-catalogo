name: Actualizar Catalogo

on:
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install pandas gspread google-auth openpyxl requests beautifulsoup4

      - name: Crear credenciales
        run: |
          mkdir -p scraper
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > scraper/credenciales.json

      - name: Test conectividad Pasteur86
        continue-on-error: true
        run: |
          echo "===== DNS ====="
          nslookup pasteur86.com || true

          echo ""
          echo "===== HTTPS (con User-Agent de navegador) ====="
          curl -I -L --max-time 30 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" \
            -H "Accept-Language: es-AR,es;q=0.9" \
            https://pasteur86.com || echo "⚠️ Test de conectividad falló, pero seguimos igual: el scraper reintenta por su cuenta."

      - name: Ejecutar Pasteur
        run: python scraper/scraper_pasteur86.py

      - name: Ejecutar VenirVos
        run: python scraper/scraper_venirvos.py

      - name: Unificar catalogo
        run: python scraper/comparar_proveedores.py

      - name: Subir a Google Sheets
        run: python scraper/subir_unificados.py